name: Implantar Funções do Firebase

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (functions)
        working-directory: ./functions
        run: |
          npm ci
          npm install

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate Firebase
        run: |
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > $HOME/gcloud.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/gcloud.json" >> $GITHUB_ENV
          gcloud auth activate-service-account --key-file=$HOME/gcloud.json
          gcloud config set project "${{ secrets.FIREBASE_PROJECT_ID }}"

      - name: Deploy Functions
        run: |
          firebase deploy --only functions --project="${{ secrets.FIREBASE_PROJECT_ID }}"

      - name: Finalização
        run: echo "✔ Deploy concluído com sucesso!"
