
name: Deploy Firebase Functions

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install dependencies (functions)
        working-directory: ./functions
        run: npm ci

      - name: Authenticate to Firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          echo "$FIREBASE_TOKEN" | firebase login:ci --no-localhost || true
          firebase projects:list || true

      - name: Configure function environment (set secrets)
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          # Example: set stripe and apple secrets from GitHub Secrets into functions config
          firebase functions:config:set stripe.secret="${{ secrets.STRIPE_SECRET }}" stripe.webhook_secret="${{ secrets.STRIPE_WEBHOOK_SECRET }}" --project="${{ secrets.FIREBASE_PROJECT_ID }}"

          # Set Google service account JSON (base64 encoded recommended)
          if [ -n "${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}" ]; then
            firebase functions:config:set google.service_account_json="${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}" --project="${{ secrets.FIREBASE_PROJECT_ID }}" || true
          fi

          # Set Apple keys (private key should be base64-encoded to preserve newlines)
          if [ -n "${{ secrets.APPLE_PRIVATE_KEY_B64 }}" ]; then
            APPLE_PRIVATE_KEY=$(echo "${{ secrets.APPLE_PRIVATE_KEY_B64 }}" | base64 --decode)
            firebase functions:config:set apple.private_key="$APPLE_PRIVATE_KEY" apple.key_id="${{ secrets.APPLE_KEY_ID }}" apple.issuer_id="${{ secrets.APPLE_ISSUER_ID }}" --project="${{ secrets.FIREBASE_PROJECT_ID }}" || true
          fi

      - name: Deploy functions
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase deploy --only functions --project="${{ secrets.FIREBASE_PROJECT_ID }}"

      - name: Post-deploy cleanup
        run: echo "Deployment finished."
