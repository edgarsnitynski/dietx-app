name: Implantar Funções do Firebase

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (functions)
        working-directory: ./functions
        run: |
          npm ci
          npm install

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate Firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}" > serviceAccount.json
          export GOOGLE_APPLICATION_CREDENTIALS="serviceAccount.json"
          firebase projects:list

      - name: Deploy Functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: serviceAccount.json
        run: |
          firebase deploy --only functions --project="${{ secrets.FIREBASE_PROJECT_ID }}"

      - name: Finalização
        run: echo "✔ Deploy concluído com sucesso!"
