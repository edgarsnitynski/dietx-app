name: Implantar Funções do Firebase

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar CLI do Firebase
        run: npm install -g firebase-tools
      - name: Install dependencies (functions)
      working-directory: ./functions
       run: npm install
     
      ##########################################################################
      # AUTENTICAÇÃO USANDO SERVICE ACCOUNT (JSON PURO)
      ##########################################################################
      - name: Criar arquivo da Service Account
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "❌ ERRO: Secret GOOGLE_SERVICE_ACCOUNT_JSON está vazio!"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > "${RUNNER_TEMP}/service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${RUNNER_TEMP}/service-account.json" >> $GITHUB_ENV

      - name: Autenticar no GCloud
        run: |
          gcloud auth activate-service-account --key-file="${RUNNER_TEMP}/service-account.json"
          gcloud config set project "${{ secrets.FIREBASE_PROJECT_ID }}"

      ##########################################################################
      # DEFINIR APENAS CONFIGURAÇÕES QUE VOCÊ USA (Stripe)
      ##########################################################################
      - name: Configurar Stripe
        run: |
          firebase functions:config:set \
            stripe.secret="${{ secrets.STRIPE_SECRET }}" \
            stripe.webhook_secret="${{ secrets.STRIPE_WEBHOOK_SECRET }}" \
            --project="${{ secrets.FIREBASE_PROJECT_ID }}"

      ##########################################################################
      # DEPLOY DAS FUNCTIONS
      ##########################################################################
      - name: Deploy Functions
        run: |
          firebase deploy --only functions --project="${{ secrets.FIREBASE_PROJECT_ID }}"

      - name: Finalização
        run: echo "✔ Deploy concluído com sucesso!"
